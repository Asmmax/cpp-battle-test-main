name: Ubuntu Build

on:
  push:
    branches: [ linux-workflow ]
  pull_request:
    branches: [ linux-workflow ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install tools
      run: sudo apt-get update && sudo apt-get install -y cmake g++

    - name: Configure
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build -j

    - name: Run program
      run: ./build/sw_battle_test commands_example.txt
